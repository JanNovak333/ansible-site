---
- name: Manage users on Gandalf
  hosts: gandalf
  become: true

  tasks:
    - name: Ensure user exists
      ansible.builtin.user:
        name: "{{ item.name }}"
        state: present
        update_password: on_create
      loop: "{{ ansible_users }}"

    - name: Manage authorized SSH keys
      ansible.posix.authorized_key:
        user: "{{ item.name }}"
        key: "{{ item.ssh_keys | join('\n') }}"
        state: present
        exclusive: true
      loop: "{{ ansible_users }}"
